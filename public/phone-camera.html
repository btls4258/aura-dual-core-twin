<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AURA 全局摄像头</title><style>
*{box-sizing:border-box}body{margin:0;background:#05090d;color:#e5eff3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}.shell{min-height:100vh;display:flex;flex-direction:column;padding:16px;gap:12px}.head{display:flex;justify-content:space-between;align-items:center}.head b{letter-spacing:.16em}.head span{font-size:12px;color:#778b95}.head-actions{display:flex;align-items:center;gap:10px}.locale-toggle{border:1px solid #334853;background:#101a20;color:#d9e7ec;padding:5px 8px;font-size:10px}.view{position:relative;flex:1;min-height:55vh;background:#000;border:1px solid #263943;overflow:hidden}.view video{width:100%;height:100%;object-fit:contain;background:#000}.guide{position:absolute;inset:9%;border:1px dashed #68d1e4aa;pointer-events:none}.guide::before{content:attr(data-guide);position:absolute;top:-25px;left:0;color:#86a1ad;font-size:11px}.status{border-left:2px solid #e5c365;background:#10191e;padding:11px;font-size:12px;color:#9eb0b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border:1px solid #334853;background:#101a20;color:#e7f0f4;padding:13px}.actions button.primary{background:#e5c365;color:#151108;border-color:#e5c365}.tips{font-size:11px;line-height:1.6;color:#71858e}.live{color:#6bd399!important}
.format-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.format-picker button{border:1px solid #30444e;background:#0b141a;color:#78909b;padding:9px 5px;font-size:11px}.format-picker button.active{border-color:#66cfe3;background:#112832;color:#dff9ff;box-shadow:inset 0 -2px #66cfe3}.mode-landscape .view{aspect-ratio:16/9;min-height:0}.mode-portrait .view{aspect-ratio:9/16;min-height:0}
.tag-overlay{position:absolute;pointer-events:none;z-index:3}.detect-status{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #263b45;background:#09141a;padding:9px 11px;font-size:11px;color:#78909b}.detect-status b{color:#dff9ff}.detect-status .ok{color:#69d4a1}.actions{grid-template-columns:repeat(3,1fr)}.actions button.detecting{border-color:#69d4a1;color:#9af0c5;background:#0d211a}
@media (orientation:portrait){.mode-auto .view{aspect-ratio:9/14;min-height:0}.guide{inset:7% 8%}}
@media (orientation:landscape){.shell{height:100vh;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(230px,1fr);grid-template-rows:auto auto auto auto auto 1fr;padding:10px;gap:9px 12px}.view{grid-column:1;grid-row:1/-1;width:100%;height:calc(100vh - 20px);min-height:0}.mode-auto .view{aspect-ratio:16/9}.head,.format-picker,.status,.detect-status,.actions,.tips{grid-column:2}.head{grid-row:1}.format-picker{grid-row:2}.status{grid-row:3}.detect-status{grid-row:4}.actions{grid-row:5}.tips{grid-row:6;align-self:start}.guide{inset:7%}.actions button{padding:11px 8px}}
</style></head><body class="mode-auto"><main class="shell"><div class="head"><b data-i18n="title">AURA · 全局视野</b><div class="head-actions"><span id="link">链路离线</span><button id="locale-toggle" class="locale-toggle" type="button">EN</button></div></div><div class="view"><video id="camera" autoplay muted playsinline></video><canvas id="tag-overlay" class="tag-overlay"></canvas><div class="guide" data-guide="完整画面预览 · 将整个桌面保持在框内"></div></div><div class="format-picker" aria-label="画面比例"><button data-mode="auto" class="active" data-i18n="auto">自动</button><button data-mode="landscape" data-i18n="landscape">横屏 16:9</button><button data-mode="portrait" data-i18n="portrait">竖屏 9:16</button></div><div id="status" class="status">点击“开启摄像头”，允许浏览器使用后置摄像头。</div><div class="detect-status"><span>AprilTag 36h11</span><b id="detect-metrics">检测器载入中</b></div><div class="actions"><button id="start" class="primary" data-i18n="start">开启摄像头</button><button id="switch" data-i18n="switch">切换镜头</button><button id="detect-toggle">暂停识别</button></div><div class="tips" data-i18n="tips">手机本地识别 AprilTag，并将检测框、中心点和 Tag ID 同步给 Mac。建议先使用清晰打印的 tag36h11 测试码。</div></main><script src="/phone-camera.js"></script></body></html>
